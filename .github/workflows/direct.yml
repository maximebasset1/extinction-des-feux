name: Direct football
on:
  schedule:
    # créneaux toutes les 2 heures de 10 h à 22 h UTC (durée max 3 h 15 chacun) : même si GitHub Actions retarde
    # ou saute un cron de plusieurs heures, un autre créneau couvre les matchs de Serie A (11 h 30 / 10 h 30 UTC)
    # jusqu'aux prolongations de Ligue des champions (22 h 30 UTC). Hors fenêtre de match, boucle.mjs rend la main
    # immédiatement sans consommer de quota API-Football ni tourner à vide.
    - cron: "15 10,12,14,16,18,20,22 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: direct
  cancel-in-progress: false
jobs:
  boucle:
    runs-on: ubuntu-latest
    timeout-minutes: 210   # filet de sécurité : la boucle s'arrête d'elle-même à 3 h 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stockage KV du relais
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" \
            | jq -r '.result[] | select(.title=="extinction-direct") | .id')
          test -n "$id"
          echo "KV_ID=$id" >> "$GITHUB_ENV"
      - name: Suivre les matchs du jour
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DUREE_MAX_MIN: "195"
        run: node relais/boucle.mjs
