name: Direct football
on:
  schedule:
    # trois créneaux (heure UTC) de 5 h 30 au plus, loin des 6 h d'un job GitHub : 10 h 55 -> 16 h 25, 15 h 25 -> 20 h 55,
    # 19 h 25 -> 0 h 55. Chaque lancement annule le précédent ; l'heure de chevauchement absorbe le retard des minuteries
    # GitHub, et les matchs de 21 h (heure de Paris), prolongations comprises, restent couverts.
    # Le quota ne dépend pas du nombre de créneaux : l'état (programme du jour, appels restants) est gardé dans KV.
    - cron: "55 10 * * *"
    - cron: "25 15 * * *"
    - cron: "25 19 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: direct
  cancel-in-progress: true
jobs:
  boucle:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # filet de sécurité : la boucle s'arrête d'elle-même à 5 h 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stockage KV du relais
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" \
            | jq -r '.result[] | select(.title=="extinction-direct") | .id')
          test -n "$id"
          echo "KV_ID=$id" >> "$GITHUB_ENV"
      - name: Suivre les matchs du jour
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DUREE_MAX_MIN: "330"
        run: node relais/boucle.mjs
