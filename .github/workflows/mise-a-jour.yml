# Met à jour les pronostics plusieurs fois par jour, puis publie le site sur GitHub Pages.
# Gratuit pour un dépôt public. Aucun secret n'est nécessaire.
name: Mise à jour des pronostics

on:
  schedule:
    - cron: "17 */3 * * 1-4"   # du lundi au jeudi : toutes les 3 heures (heure UTC)
    # du vendredi au dimanche : deux fois par heure (GitHub prend souvent du retard ; plus de chances
    # d'enregistrer le pronostic entre la fin des essais et le début de la qualif)
    - cron: "17,47 * * * 5,6,0"
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions
  push:
    # les branches « feat/... » et « fix/... » lancent le calcul pour le vérifier, sans rien publier ni enregistrer
    branches: [main, "feat/**", "fix/**"]
    paths: ["site/**", "src/**", "scripts/**", "football/**", "tests/**", "data/calendar.json", "requirements-ci.txt", ".github/workflows/**"]

permissions: {}   # aucun droit par défaut : chaque tâche reçoit seulement ce dont elle a besoin

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  calcul:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      artefact: ${{ steps.artefact.outcome }}
    permissions:
      contents: write   # enregistrer les nouvelles données et le journal des pronostics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Installer les bibliothèques
        run: pip install -r requirements-ci.txt

      - name: Reprendre les données déjà téléchargées
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/processed/cache_backtest.pkl
          key: donnees-aucune
          restore-keys: donnees-

      # calendrier F1 : si la source ne répond pas, on garde celui du dépôt (le football n'en dépend pas)
      - name: Mettre à jour le calendrier
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/update_calendar.py

      # pronostics F1 du lancement précédent : gardés si le calcul F1 échoue (le football est publié quand même)
      - name: Reprendre les pronostics F1 précédents
        uses: actions/cache/restore@v4
        with:
          path: |
            site/data/next.json
            site/data/history.json
            site/data/performance.json
            site/data/journal.json
            site/data/drivers.json
            site/data/etude_f1.json
          key: f1-sortie-aucune
          restore-keys: f1-sortie-

      - name: Télécharger, réentraîner, prédire
        id: f1
        continue-on-error: true
        timeout-minutes: 45
        run: python src/main.py

      # un calcul F1 arrêté en cours de route peut laisser des fichiers à moitié réécrits : on revient aux précédents
      - name: Revenir aux pronostics F1 précédents
        if: steps.f1.outcome == 'failure'
        uses: actions/cache/restore@v4
        with:
          path: |
            site/data/next.json
            site/data/history.json
            site/data/performance.json
            site/data/journal.json
            site/data/drivers.json
            site/data/etude_f1.json
          key: f1-sortie-aucune
          restore-keys: f1-sortie-

      - name: Garder les pronostics F1
        if: steps.f1.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            site/data/next.json
            site/data/history.json
            site/data/performance.json
            site/data/journal.json
            site/data/drivers.json
            site/data/etude_f1.json
          key: f1-sortie-${{ github.run_id }}-${{ github.run_attempt }}

      # branche de travail : vérifie que la grille officielle d'une course passée est bien lue (aucune publication)
      - name: Vérifier la lecture de la grille officielle
        if: github.ref != 'refs/heads/main'
        run: python scripts/verifier_grille.py 2026 "Las Vegas Grand Prix"

      # si le calcul football échoue, les pages gardent les pronostics précédents et la F1 est publiée quand même
      - name: Reprendre les données football
        uses: actions/cache/restore@v4
        with:
          path: |
            data/football/eu
            site/data/foot
          key: foot-aucune
          restore-keys: foot-

      # état du quota de cotes : gardé à chaque lancement, pas une fois par jour, sinon la limite de 3 h ne tiendrait pas
      - name: Reprendre l'état des cotes
        uses: actions/cache/restore@v4
        with:
          path: data/football/cotes
          key: recherche-cotes-aucune
          restore-keys: recherche-cotes-

      # clés gratuites rangées dans les secrets du dépôt ; sans elles, les coupes d'Europe sont simplement absentes
      # limite de temps : une source qui ne répond plus ne doit pas retarder la publication de la F1
      - name: "Football : sept compétitions"
        id: foot
        if: github.ref == 'refs/heads/main'   # les branches n'utilisent pas les crédits des API de football
        continue-on-error: true
        timeout-minutes: 30
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python football/pipeline.py

      # même principe que pour la F1 : après un échec, les pages reprennent les derniers pronostics complets
      - name: Revenir aux pronostics football précédents
        if: steps.foot.outcome == 'failure'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/football/eu
            site/data/foot
          key: foot-aucune
          restore-keys: foot-

      - name: Repérer les données téléchargées
        if: always()
        id: inventaire
        run: |
          mkdir -p data/raw
          sig=$( (find data/raw -type f ! -name '*.part' -printf '%P %s\n' | sort; sha256sum data/processed/cache_backtest.pkl 2>/dev/null) | sha256sum | cut -c1-16)
          echo "cle=donnees-$sig" >> "$GITHUB_OUTPUT"

      - name: Garder les données pour la prochaine fois
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/processed/cache_backtest.pkl
          key: ${{ steps.inventaire.outputs.cle }}

      - name: Enregistrer l'état des cotes
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/football/cotes
          key: recherche-cotes-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Garder les données football
        if: always() && steps.foot.outcome != 'failure'
        run: |
          mkdir -p data/football/eu site/data/foot data/football/cotes
          # une sauvegarde par jour au plus : les fichiers changent à chaque calcul
          echo "FOOT_CLE=foot-$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Enregistrer le cache football
        if: always() && steps.foot.outcome != 'failure'
        uses: actions/cache/save@v4
        with:
          path: |
            data/football/eu
            site/data/foot
          key: ${{ env.FOOT_CLE }}

      - name: Vérifier
        run: python -m pytest tests -q

      # un envoi refusé (dépôt modifié entre-temps) est retenté ; s'il échoue encore, le site est publié quand même
      # et le lancement finit en échec pour que le journal non enregistré se voie
      - name: Enregistrer les nouvelles données et le journal
        id: enregistrement
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/calendar.json data/journal data/processed/best_laps.csv data/processed/race_results.csv
          if [ -f data/football/resultats_coupes.csv ]; then git add data/football/resultats_coupes.csv; fi
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git commit -m "Mise à jour automatique des pronostics"
          for essai in 1 2 3; do
            if git pull --rebase --quiet && git push; then exit 0; fi
            echo "Envoi refusé (essai $essai), nouvel essai dans 20 s"
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        id: artefact
        if: github.ref == 'refs/heads/main'
        with:
          path: site

      - name: Signaler le journal non enregistré
        if: steps.enregistrement.outcome == 'failure'
        run: |
          echo "::error::Le journal des pronostics n'a pas pu être envoyé sur le dépôt ; le site a été publié quand même."
          exit 1

  publication:
    needs: calcul
    # seule la branche principale publie ; le site part dès que son paquet est prêt, même si le lancement finit en échec
    if: always() && github.ref == 'refs/heads/main' && needs.calcul.outputs.artefact == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publier le site
      id-token: write   # prouver à Pages que la publication vient bien de ce dépôt
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
