# Met à jour les pronostics plusieurs fois par jour, puis publie le site sur GitHub Pages.
# Gratuit pour un dépôt public. Aucun secret n'est nécessaire.
name: Mise à jour des pronostics

on:
  schedule:
    - cron: "17 */3 * * 1-4"   # du lundi au jeudi : toutes les 3 heures (heure UTC)
    - cron: "17 * * * 5,6,0"   # du vendredi au dimanche (week-ends de course) : toutes les heures
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]
    paths: ["site/**", "src/**", "scripts/**", "football/**", "tests/**", "data/calendar.json", "requirements-ci.txt", ".github/workflows/**"]

permissions: {}   # aucun droit par défaut : chaque tâche reçoit seulement ce dont elle a besoin

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  calcul:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # enregistrer les nouvelles données et le journal des pronostics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Installer les bibliothèques
        run: pip install -r requirements-ci.txt

      - name: Reprendre les données déjà téléchargées
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/processed/cache_backtest.pkl
          key: donnees-aucune
          restore-keys: donnees-

      - name: Mettre à jour le calendrier
        run: python scripts/update_calendar.py

      - name: Télécharger, réentraîner, prédire
        run: python src/main.py

      # si le calcul football échoue, les pages gardent les pronostics précédents et la F1 est publiée quand même
      - name: Reprendre les données football
        uses: actions/cache/restore@v4
        with:
          path: |
            data/football/eu
            site/data/foot
          key: foot-aucune
          restore-keys: foot-

      # état du quota de cotes : gardé à chaque lancement, pas une fois par jour, sinon la limite de 3 h ne tiendrait pas
      - name: Reprendre l'état des cotes
        uses: actions/cache/restore@v4
        with:
          path: data/football/cotes
          key: recherche-cotes-aucune
          restore-keys: recherche-cotes-

      # clés gratuites rangées dans les secrets du dépôt ; sans elles, les coupes d'Europe sont simplement absentes
      - name: "Football : six compétitions"
        continue-on-error: true
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python football/pipeline.py

      - name: Repérer les données téléchargées
        if: always()
        id: inventaire
        run: |
          mkdir -p data/raw
          sig=$( (find data/raw -type f ! -name '*.part' -printf '%P %s\n' | sort; sha256sum data/processed/cache_backtest.pkl 2>/dev/null) | sha256sum | cut -c1-16)
          echo "cle=donnees-$sig" >> "$GITHUB_OUTPUT"

      - name: Garder les données pour la prochaine fois
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/processed/cache_backtest.pkl
          key: ${{ steps.inventaire.outputs.cle }}

      - name: Enregistrer l'état des cotes
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/football/cotes
          key: recherche-cotes-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Garder les données football
        if: always()
        run: |
          mkdir -p data/football/eu site/data/foot data/football/cotes
          # une sauvegarde par jour au plus : les fichiers changent à chaque calcul
          echo "FOOT_CLE=foot-$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Enregistrer le cache football
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/football/eu
            site/data/foot
          key: ${{ env.FOOT_CLE }}

      - name: Vérifier
        run: python -m pytest tests -q

      - name: Enregistrer les nouvelles données et le journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/calendar.json data/journal data/processed/best_laps.csv data/processed/race_results.csv
          if [ -f data/football/resultats_coupes.csv ]; then git add data/football/resultats_coupes.csv; fi
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Mise à jour automatique des pronostics"
            git pull --rebase --quiet && git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publication:
    needs: calcul
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publier le site
      id-token: write   # prouver à Pages que la publication vient bien de ce dépôt
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
