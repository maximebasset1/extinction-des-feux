name: Sonde des clés du direct
on:
  push:
    branches: ["feat/direct-relais"]
    paths: [".github/workflows/sonde-direct.yml"]
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API-Football
        env:
          CLE: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          appel() { curl -s -H "x-apisports-key: $CLE" "https://v3.football.api-sports.io/$1"; }
          echo "== status"; appel status | jq -c '.response | {abonnement: .subscription.plan, actif: .subscription.active, requetes: .requests}'
          echo "== live=all"; appel "fixtures?live=all" | jq -c '{erreurs: .errors, nb: .results, ligues: [.response[].league.id] | unique | .[0:40]}'
          J=$(date -u +%F)
          echo "== date=$J"; appel "fixtures?date=$J" | jq -c '{erreurs: .errors, nb: .results, nos: [.response[] | select(.league.id|IN(39,78,140,61,2,3)) | {l: .league.id, s: .league.season, d: .fixture.date, st: .fixture.status.short, m: .fixture.status.elapsed, h: .teams.home.name, a: .teams.away.name, g: .goals}]}'
          echo "== ligue 1 saison 2026"; appel "fixtures?league=61&season=2026&next=3" | jq -c '{erreurs: .errors, nb: .results}'
      - name: Cloudflare
        env:
          JETON: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMPTE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "== jeton"; curl -s -H "Authorization: Bearer $JETON" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{ok: .success, statut: .result.status, erreurs: .errors}'
          echo "== sous-domaine workers.dev"; curl -s -H "Authorization: Bearer $JETON" "https://api.cloudflare.com/client/v4/accounts/$COMPTE/workers/subdomain" | jq -c '{ok: .success, sousdomaine: .result.subdomain, erreurs: .errors}'
          echo "== KV"; curl -s -H "Authorization: Bearer $JETON" "https://api.cloudflare.com/client/v4/accounts/$COMPTE/storage/kv/namespaces" | jq -c '{ok: .success, nb: (.result|length), erreurs: .errors}'
