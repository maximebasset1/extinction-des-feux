# relais du direct : sert les scores rangés dans KV par relais/boucle.mjs ; déployé par .github/workflows/relais.yml
name = "extinction-direct"
main = "relais.js"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = true

# aucune minuterie : le Worker n'appelle plus API-Football
[triggers]
crons = []

[[kv_namespaces]]
binding = "DIRECT"
id = "KV_ID"

# ligues de pronostics (schéma : schema.sql) ; D1_ID est remplacé au déploiement, comme KV_ID
[[d1_databases]]
binding = "DB"
database_name = "extinction-ligues"
database_id = "D1_ID"
